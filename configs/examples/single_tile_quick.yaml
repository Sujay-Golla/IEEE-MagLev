# Fastest config to play with: one tile, coarse sampling. Good for first experiments.
name: single_tile_quick
mover:
  type: cube_grid
  params: {nx: 4, ny: 4, size_mm: 8, pitch_mm: 16}
coil:
  type: round
  params: {inner_diameter_mm: 5, outer_diameter_mm: 24, height_mm: 12, awg: 26, turns: auto}
tile:
  layout: square
  params: {n: 4, pitch_mm: 25}
grid: {rows: 1, cols: 1}
operating: {gap_mm: 3}
analysis: {cutoff_mm: 60, xy_samples: 4, gaps_mm: [2, 3, 4, 6, 8]}
handoff: {fade_inner_mm: 30, fade_outer_mm: 55}
